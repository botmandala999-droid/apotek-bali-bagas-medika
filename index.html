<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Apotek Bali Bagas Medika</title>
<script src="https://www.gstatic.com/charts/loader.js">
  // Cache data ke localStorage biar cepet pas refresh
  try{
    localStorage.setItem("bbm_px", JSON.stringify(PX));
    localStorage.setItem("bbm_ft", String(FT));
    localStorage.setItem("bbm_fk", String(FK));
    localStorage.setItem("bbm_f", JSON.stringify(F));
    localStorage.setItem("bbm_ld", JSON.stringify(LD));
    localStorage.setItem("bbm_la", JSON.stringify(LA));
    localStorage.setItem("bbm_lc", LC);
  }catch(e){}
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif}
body{background:#f0f2f5;min-height:100vh}
.header{background:linear-gradient(135deg,#1e3a5f,#1d4ed8);color:white;padding:16px 20px}
.header h1{font-size:20px;font-weight:700}
.header p{font-size:12px;opacity:.7;margin-top:2px}
.tabs{display:flex;background:white;border-bottom:1px solid #e5e7eb;padding-left:12px;position:sticky;top:0;z-index:10}
.tab{padding:10px 18px;border:none;background:none;cursor:pointer;color:#64748b;font-size:14px;border-bottom:2px solid transparent;font-weight:500}
.tab.active{color:#1d4ed8;border-bottom-color:#1d4ed8;font-weight:600}
.content{padding:12px;max-width:1200px;margin:0 auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.card{background:white;border-radius:8px;border:1px solid #e5e7eb;padding:10px 14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-label{font-size:10px;color:#9ca3af;text-transform:uppercase;letter-spacing:.3px}
.card-value{font-size:18px;font-weight:700;margin-top:2px}
.chart-box{background:white;border-radius:8px;border:1px solid #e5e7eb;padding:12px;margin-bottom:12px}
.chart-box h3{font-size:13px;color:#374151;margin-bottom:8px}
.chart{display:flex;gap:4px;align-items:end;height:90px;padding:8px 4px;background:#f9fafb;border-radius:6px}
.chart-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.chart-bar .val{font-size:8px;color:#6b7280}
.chart-bar .bar{width:100%;background:#3b82f6;border-radius:3px 3px 0 0;min-height:4px}
.chart-bar .lbl{font-size:9px;color:#374151;font-weight:500}
.table-wrap{background:white;border-radius:8px;border:1px solid #e5e7eb;overflow:hidden;margin-bottom:12px}
.table-title{padding:10px 14px;border-bottom:1px solid #e5e7eb;font-size:13px;font-weight:600;color:#374151}
.table-title span{font-weight:400;font-size:11px;color:#9ca3af}
.table-scroll{max-height:420px;overflow:auto}
table{width:100%;font-size:11px;border-collapse:collapse}
thead{background:#f1f5f9;position:sticky;top:0}
th{padding:6px 8px;border-bottom:1px solid #e5e7eb;font-size:10px;color:#475569;text-align:right}
td{padding:4px 8px;border-bottom:1px solid #f1f5f9;font-size:10px;color:#374151;text-align:right}
td.l{text-align:left}
tr:nth-child(even){background:#f8fafc}
.lunas{background:#f0fdf4!important}
.belum{background:#fef2f2!important}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:10px;font-weight:500}
.badge-green{background:#dcfce7;color:#16a34a}
.badge-red{background:#fee2e2;color:#dc2626}
</style>
</head>
<body>
<div class="header"><h1>Apotek Bali Bagas Medika</h1><p>Dashboard Monitoring</p></div>
<div class="tabs" id="tabs"></div>
<div class="content" id="content"><p style="color:#6b7280;text-align:center;padding:40px" id="loading">Memuat data...</p></div>
<script>
const S26="12ifCX85urqUxt67Ad5xr26ffzGxvGNz5FFZT38oKZM8";
const FSID="1f0xEiBz5Mzu79zxks1Ew0lfAdwQu-7VKvKxaUcz3VzU";
const LSID="1Pl9uQvDSq4qWVT6MzqWCiZoI4Oga0wMhVu7wFwMoW4I";
const M26=[{g:0,l:"Jan"},{g:1981407338,l:"Feb"},{g:1445967367,l:"Mar"},{g:1565950911,l:"Apr"},{g:2013738206,l:"Mei"},{g:163552086,l:"Jun"},{g:1190948522,l:"Jul"}];

function p(v){if(typeof v=="number")return v;return parseInt(String(v||"0").replace(/[^\d\-]/g,""),10)||0}
function fr(n){return typeof n==="number"?"Rp "+n.toLocaleString("id-ID"):"-"}
function $(s){return document.getElementById(s)}

async function gv(sid,gid){
  const r=await fetch("https://docs.google.com/spreadsheets/d/"+sid+"/gviz/tq?tqx=out:json&tq=&gid="+gid);
  const t=await r.text();
  const j=JSON.parse(t.slice(t.indexOf("(")+1,t.lastIndexOf(")")));
  return j.table.rows;
}

let PX=[],FT=0,FK=0,F=[],C="",CB="",LD={},LC="",LA=[];

async function load(){  // Restore dari cache kalo ada
  try{
    const cx = localStorage.getItem("bbm_px");
    if(cx){PX=JSON.parse(cx);FT=parseInt(localStorage.getItem("bbm_ft")||"0");FK=parseInt(localStorage.getItem("bbm_fk")||"0");
      F=JSON.parse(localStorage.getItem("bbm_f")||"[]");
      LD=JSON.parse(localStorage.getItem("bbm_ld")||"{}");
      LA=JSON.parse(localStorage.getItem("bbm_la")||"[]");
      LC=localStorage.getItem("bbm_lc")||"";
      rt();rc("p");
    }
  }catch(e){}

  rt();
  .innerHTML='<p style="color:#6b7280;text-align:center;padding:40px">Memuat data Januari...</p>';
  try{
    const rs=await gv(S26,0);
    for(const r of rs){
      const c=r.c;if(!c||!c[0]||!c[0].v)continue;
      const t=typeof c[0].v=="string"?c[0].v:(typeof c[0].f=="string"?c[0].f:"");if(!t.includes("/"))continue;
      PX.push({t,b:"Jan",
        c1:p(c[1]&&c[1].v),c2:p(c[2]&&c[2].v),c3:p(c[3]&&c[3].v),
        c4:p(c[4]&&c[4].v),c5:p(c[5]&&c[5].v),c6:p(c[6]&&c[6].v),
        c7:p(c[7]&&c[7].v),c8:p(c[8]&&c[8].v),tt:p(c[9]&&c[9].v),kj:p(c[10]&&c[10].v)});
      FT+=p(c[9]&&c[9].v);FK+=p(c[10]&&c[10].v);
    }
  }catch(e){}
  rp();
  // Ambil sisanya background
  setTimeout(loadRest, 100);
}

async function loadRest(){
  for(let i=1;i<M26.length;i++){
    try{
      const rs=await gv(S26,M26[i].g);
      for(const r of rs){
        const c=r.c;if(!c||!c[0]||!c[0].v)continue;
        const t=typeof c[0].v=="string"?c[0].v:(typeof c[0].f=="string"?c[0].f:"");if(!t.includes("/"))continue;
        PX.push({t,b:M26[i].l,
          c1:p(c[1]&&c[1].v),c2:p(c[2]&&c[2].v),c3:p(c[3]&&c[3].v),
          c4:p(c[4]&&c[4].v),c5:p(c[5]&&c[5].v),c6:p(c[6]&&c[6].v),
          c7:p(c[7]&&c[7].v),c8:p(c[8]&&c[8].v),tt:p(c[9]&&c[9].v),kj:p(c[10]&&c[10].v)});
        FT+=p(c[9]&&c[9].v);FK+=p(c[10]&&c[10].v);
      }
    }catch(e){}
  }
  if(!C)rp();
  // Faktur  
  for(const m of M26){
    try{
      const rs=await gv(FSID,m.g);
      for(const r of rs){
        const c=r.c;if(!c||!c[0]||!c[0].v)continue;
        const no=String(c[0].v).trim();
        if(!no||no=="No"||no=="NO")continue;
        const n=parseInt(no,10);if(!n||n<=0)continue;
        F.push({no,nb:["TRUE","1","Y","YES"].includes(String(c[5]&&c[5].v||"").trim().toUpperCase()),b:m.l,no2:no,
          pbf:String(c[1]&&c[1].v||"").trim(),jml:p(c[2]&&c[2].v)});
      }
    }catch(e){}
  }
  // LPH
  for(const m of M26){
    try{
      const rs=await gv(LSID,m.g);
      let tg="",rr=[];
      for(const r of rs){
        const c=r.c;if(!c)continue;
        if(c[3]&&c[3].v){const d=String(c[3].v).trim();if(d.includes("/"))tg=d;}
        if(c[0]&&c[0].v){rr.push({u:String(c[0].v).trim(),p:String(c[1]&&c[1].v||"-").trim(),s:String(c[2]&&c[2].v||"-").trim(),t:String(c[3]&&c[3].v||"-").trim()});}
      }
      if(tg&&rr.length){LD[tg]={tg,rr};LA.push(tg);}
    }catch(e){}
  }
  LA.sort((a,b)=>new Date(a.split("/").reverse().join("-"))-new Date(b.split("/").reverse().join("-")));
  if(LA.length)LC=LA[LA.length-1];
}

  let a=[],tt=0,kk=0;
  for(const m of M26){
    try{
      const rs=await gv(S26,m.g);
      for(const r of rs){
        const c=r.c;if(!c||!c[0]||!c[0].v)continue;
        const t=typeof c[0].v=="string"?c[0].v:(typeof c[0].f=="string"?c[0].f:"");if(!t.includes("/"))continue;
        a.push({t,b:m.l,
          c1:p(c[1]&&c[1].v),c2:p(c[2]&&c[2].v),c3:p(c[3]&&c[3].v),
          c4:p(c[4]&&c[4].v),c5:p(c[5]&&c[5].v),c6:p(c[6]&&c[6].v),
          c7:p(c[7]&&c[7].v),c8:p(c[8]&&c[8].v),tt:p(c[9]&&c[9].v),kj:p(c[10]&&c[10].v)});
        tt+=p(c[9]&&c[9].v);kk+=p(c[10]&&c[10].v);
      }
    }catch(e){}
  }
  a.sort((a,b)=>new Date(a.t.split("/").reverse().join("-"))-new Date(b.t.split("/").reverse().join("-")));
  PX=a;FT=tt;FK=kk;

  let sf=[];
  for(const m of M26){
    try{
      const rs=await gv(FSID,m.g);
      for(const r of rs){
        const c=r.c;if(!c||!c[0]||!c[0].v)continue;
        const no=String(c[0].v).trim();
        if(!no||no=="No"||no=="NO")continue;
        const n=parseInt(no,10);
        if(!n||n<=0)continue;
        const sbv=String(c[5]&&c[5].v||"").trim().toUpperCase();
        sf.push({no,nb:sbv=="TRUE"||sbv=="1",b:m.l,no2:no,
          pbf:String(c[1]&&c[1].v||"").trim(),
          jml:p(c[2]&&c[2].v)});
      }
    }catch(e){}
  }
  F=sf;

  for(const m of M26){
    try{
      const rs=await gv(LSID,m.g);
      let tg="",rr=[];
      for(const r of rs){
        const c=r.c;
        if(!c)continue;
        if(c[3]&&c[3].v){const d=String(c[3].v).trim();if(d.includes("/"))tg=d;}
        if(c[0]&&c[0].v){rr.push({u:String(c[0].v).trim(),p:String(c[1]&&c[1].v||"-").trim(),s:String(c[2]&&c[2].v||"-").trim(),t:String(c[3]&&c[3].v||"-").trim()});}
      }
      if(tg&&rr.length){LD[tg]={tg,rr};LA.push(tg);}
    }catch(e){}
  }
  LA.sort((a,b)=>new Date(a.split("/").reverse().join("-"))-new Date(b.split("/").reverse().join("-")));
  if(LA.length)LC=LA[LA.length-1];

  rt();rc("p");
}

function rt(){
  $("tabs").innerHTML=[{k:"p",l:"Penjualan"},{k:"l",l:"LPH"},{k:"f",l:"Faktur"}].map(t=>'<button class="tab'+(t.k==="p"?" active":"")+'" onclick="sc(\''+t.k+'\')">'+t.l+'</button>').join("");
}
function sc(k){document.querySelectorAll(".tab").forEach((t,i)=>t.className="tab"+(i==["p","l","f"].indexOf(k)?" active":""));rc(k);}
function rc(k){if(k=="p")rp();else if(k=="l")rl();else rf();}

function rp(){
  const bln=["Jan","Feb","Mar","Apr","Mei","Jun","Jul"];
  const fl=C?PX.filter(d=>d.b==C):PX;
  const mt=fl.reduce((s,d)=>s+d.tt,0),mk=fl.reduce((s,d)=>s+d.kj,0);
  let h=`<div style="margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap">
    <button onclick="C='';rp()" style="padding:6px 14px;border-radius:20px;border:1px solid ${C==''?'#1d4ed8':'#d1d5db'};background:${C==''?'#1d4ed8':'white'};color:${C==''?'white':'#374151'};cursor:pointer;font-size:13px;font-weight:500">Semua</button>
    ${bln.map(b=>`<button onclick="C='${b}';rp()" style="padding:6px 14px;border-radius:20px;border:1px solid ${C==b?'#1d4ed8':'#d1d5db'};background:${C==b?'#1d4ed8':'white'};color:${C==b?'white':'#374151'};cursor:pointer;font-size:13px;font-weight:500">${b}</button>`).join("")}
    </div><div class="cards">
    <div class="card"><div class="card-label">Omzet${C?' '+C:' 2026'}</div><div class="card-value" style="color:#d97706">${fr(mt)}</div></div>
    <div class="card"><div class="card-label">Kunjungan</div><div class="card-value" style="color:#2563eb">${mk.toLocaleString("id-ID")}</div></div>
    <div class="card"><div class="card-label">Rata/Hari</div><div class="card-value" style="color:#059669">${fr(fl.length>0?Math.round(mt/fl.length):0)}</div></div>
    <div class="card"><div class="card-label">Faktur Belum</div><div class="card-value" style="color:#dc2626">${F.filter(d=>!d.nb).length}</div></div></div>
    <div class="chart-box"><h3>Omzet per Bulan</h3><div class="chart">
    ${bln.map(b=>{const dd=PX.filter(d=>d.b==b);const tot=dd.reduce((s,d)=>s+d.tt,0);const hh=FT>0?(tot/FT)*80:0;return `<div class="chart-bar"><div class="val">${fr(tot)}</div><div class="bar" style="height:${Math.max(hh,3)}px;background:${C==b?'#d97706':'#3b82f6'}"></div><div class="lbl">${b}</div></div>`}).join("")}
    </div></div>
    <div class="table-wrap"><div class="table-title">Penjualan Harian 2026${C?' - '+C:''} <span>(${fl.length} baris)</span></div>
    <div class="table-scroll"><table><thead><tr>
    <th style="text-align:left">Tgl</th><th>Cash P</th><th>Mandiri P</th><th>QRIS P</th><th>Jml P</th><th>Cash S</th><th>Mandiri S</th><th>QRIS S</th><th>Jml S</th><th>Total</th><th>Kunj</th></tr></thead><tbody>
    ${[...fl].reverse().map(d=>`<tr><td class="l">${d.t}</td><td>${fr(d.c1)}</td><td>${fr(d.c2)}</td><td>${fr(d.c3)}</td><td>${fr(d.c4)}</td><td>${fr(d.c5)}</td><td>${fr(d.c6)}</td><td>${fr(d.c7)}</td><td>${fr(d.c8)}</td><td style="font-weight:600;color:#2563eb">${fr(d.tt)}</td><td>${d.kj}</td></tr>`).join("")}
    </tbody></table></div></div>`;
  $("content").innerHTML=h;
}

function rl(){
  if(!LC||!LD[LC]){$("content").innerHTML='<p style="color:#6b7280;text-align:center;padding:20px">Memuat LPH...</p>';return;}
  const d=LD[LC];
  let h=`<div style="margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
    <select onchange="LC=this.value;rl()" style="padding:8px 14px;border-radius:6px;border:1px solid #d1d5db;font-size:13px;background:white;cursor:pointer;flex:1;max-width:200px">
    ${LA.map(t=>`<option value="${t}"${LC==t?' selected':''}>${t}</option>`).join("")}
    </select>
    <button onclick="window.print()" style="background:#1d4ed8;color:white;border:none;padding:8px 20px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500">Cetak</button></div>
    <div class="table-wrap" id="lp"><div style="text-align:center;padding:8px;border-bottom:1px solid #e5e7eb">
    <h2 style="font-size:13px;font-weight:700;margin:0">LAPORAN PENJUALAN HARIAN (LPH)</h2>
    <p style="font-size:10px;color:#6b7280;margin:1px 0">APOTEK BALI BAGAS MEDIKA</p>
    ${d.tg?'<p style="font-size:11px;font-weight:700;margin:2px 0 0">TANGGAL: '+d.tg+'</p>':''}
    </div><table><thead><tr><th style="text-align:left">URAIAN</th><th>PAGI</th><th>SIANG</th><th>TOTAL</th></tr></thead><tbody>
    ${d.rr.map((r,i)=>`<tr${i%2===1?' style="background:#f8fafc"':''}><td class="l" style="font-weight:${r.u.toUpperCase()==="KUNJUNGAN"?600:400}">${r.u}</td><td>${r.p}</td><td>${r.s}</td><td style="font-weight:600">${r.t}</td></tr>`).join("")}
    </tbody></table></div>`;
  $("content").innerHTML=h;
}

function rf(){
  const bln=["Jan","Feb","Mar","Apr","Mei","Jun","Jul"];
  const fl=CB?F.filter(d=>d.b==CB):F;
  const l=fl.filter(d=>d.nb).length,bl=fl.filter(d=>!d.nb).length,nv=fl.reduce((s,d)=>s+d.jml,0),pv=fl.filter(d=>!d.nb).reduce((s,d)=>s+d.jml,0);
  let h=`<div style="margin-bottom:12px;display:flex;gap:6px;flex-wrap:wrap">
    <button onclick="CB='';rf()" style="padding:6px 14px;border-radius:20px;border:1px solid ${CB==''?'#1d4ed8':'#d1d5db'};background:${CB==''?'#1d4ed8':'white'};color:${CB==''?'white':'#374151'};cursor:pointer;font-size:13px;font-weight:500">Semua</button>
    ${bln.map(b=>`<button onclick="CB='${b}';rf()" style="padding:6px 14px;border-radius:20px;border:1px solid ${CB==b?'#1d4ed8':'#d1d5db'};background:${CB==b?'#1d4ed8':'white'};color:${CB==b?'white':'#374151'};cursor:pointer;font-size:13px;font-weight:500">${b}</button>`).join("")}
    </div><div class="cards">
    <div class="card"><div class="card-label">Total${CB?' '+CB:''}</div><div class="card-value" style="color:#3b82f6">${fl.length}</div></div>
    <div class="card"><div class="card-label">Lunas</div><div class="card-value" style="color:#10b981">${l}</div></div>
    <div class="card"><div class="card-label">Belum</div><div class="card-value" style="color:#ef4444">${bl}</div></div>
    <div class="card"><div class="card-label">Nilai</div><div class="card-value" style="color:#8b5cf6;font-size:15px">${fr(nv)}</div></div>
    <div class="card"><div class="card-label">Piutang</div><div class="card-value" style="color:#dc2626;font-size:15px">${fr(pv)}</div></div></div>
    <div class="table-wrap"><div class="table-title">Faktur 2026 <span>(${fl.length} faktur)</span></div>
    <div class="table-scroll"><table><thead><tr>
    <th style="text-align:left">Bln</th><th style="text-align:left">No</th><th style="text-align:left">PBF</th><th>Nilai</th><th style="text-align:center">Status</th></tr></thead><tbody>
    ${fl.slice(0,200).map(d=>`<tr class="${d.nb?'lunas':'belum'}"><td class="l">${d.b}</td><td class="l">${d.no2}</td><td class="l">${d.pbf}</td><td>${fr(d.jml)}</td><td style="text-align:center"><span class="badge ${d.nb?'badge-green':'badge-red'}">${d.nb?"LUNAS":"BELUM"}</span></td></tr>`).join("")}
    </tbody></table></div></div>`;
  $("content").innerHTML=h;
}

load();

  // Cache data ke localStorage biar cepet pas refresh
  try{
    localStorage.setItem("bbm_px", JSON.stringify(PX));
    localStorage.setItem("bbm_ft", String(FT));
    localStorage.setItem("bbm_fk", String(FK));
    localStorage.setItem("bbm_f", JSON.stringify(F));
    localStorage.setItem("bbm_ld", JSON.stringify(LD));
    localStorage.setItem("bbm_la", JSON.stringify(LA));
    localStorage.setItem("bbm_lc", LC);
  }catch(e){}
</script>
</body>
</html>

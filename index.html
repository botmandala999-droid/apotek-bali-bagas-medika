<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Apotek Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#f0f2f5}
.hdr{background:#1e40af;color:#fff;padding:14px 16px}
.hdr h1{font-size:18px}
.tabs{display:flex;background:#fff;border-bottom:1px solid #ddd;position:sticky;top:0;z-index:10}
.tab{padding:10px 16px;border:none;background:none;cursor:pointer;color:#666;font-size:13px;border-bottom:2px solid transparent;font-weight:500}
.tab.aktif{color:#1e40af;border-bottom-color:#1e40af;font-weight:600}
.ct{padding:10px}
.cd{background:#fff;border-radius:8px;padding:12px;margin-bottom:10px}
.cd label{font-size:10px;color:#999}
.cd val{font-size:22px;font-weight:700;display:block;margin-top:2px}
.tb{background:#fff;border-radius:8px;overflow:hidden;margin-bottom:10px}
.tb h3{padding:10px 12px;font-size:13px;border-bottom:1px solid #eee}
table{width:100%;font-size:11px;border-collapse:collapse}
th{background:#f5f7fa;padding:6px 8px;font-size:10px;color:#555;text-align:right;border-bottom:1px solid #ddd;position:sticky;top:0}
td{padding:4px 8px;border-bottom:1px solid #f0f0f0;font-size:10px;text-align:right}
td.l{text-align:left}
tr:nth-child(even){background:#fafafa}
.lunas td{background:#f0fdf4!important}
.belum td{background:#fef2f2!important}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;font-weight:500}
.bdg-h{background:#dcfce7;color:#16a34a}
.bdg-m{background:#fee2e2;color:#dc2626}
.btn{padding:6px 12px;border-radius:15px;border:1px solid #d1d5db;background:#fff;color:#374151;cursor:pointer;font-size:12px;margin:2px}
.btn.on{border-color:#1e40af;background:#1e40af;color:#fff}
.sl{padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;background:#fff}
</style>
</head>
<body>
<div class="hdr"><h1>Apotek Bali Bagas Medika</h1></div>
<div class="tabs" id="tab"></div>
<div class="ct" id="ctx"><p style="color:#999;text-align:center;padding:40px">Loading...</p></div>
<script>
const V="12ifCX85urqUxt67Ad5xr26ffzGxvGNz5FFZT38oKZM8"
const W="1f0xEiBz5Mzu79zxks1Ew0lfAdwQu-7VKvKxaUcz3VzU"
const X="1Pl9uQvDSq4qWVT6MzqWCiZoI4Oga0wMhVu7wFwMoW4I"
const M=[{g:0,l:"Jan"},{g:1981407338,l:"Feb"},{g:1445967367,l:"Mar"},{g:1565950911,l:"Apr"},{g:2013738206,l:"Mei"},{g:163552086,l:"Jun"},{g:1190948522,l:"Jul"}]
async function Q(s,g){
  const r=await fetch("https://docs.google.com/spreadsheets/d/"+s+"/gviz/tq?tqx=out:json&tq=&gid="+g)
  const t=await r.text()
  return JSON.parse(t.slice(t.indexOf("(")+1,t.lastIndexOf(")"))).table.rows
}
function p(v){return typeof v=="number"?v:(parseInt(String(v||"0").replace(/[^\d-]/g,""),10)||0)}
function f(n){return typeof n=="number"?"Rp "+n.toLocaleString("id-ID"):"-"}
let D=[],E=0,G=0,H=[],I="",J="",K={},L="",N=[],O="p"
async function init(){
  O="p";document.getElementById("tab").innerHTML=""
  let a=[],b=0,c=0
  for(const m of M){try{
    const r=await Q(V,m.g)
    for(const x of r){const y=x.c;if(!y)continue
      const t=typeof y[0].v=="string"?y[0].v:(y[0].f||"")
      if(!t||!t.includes("/"))continue
      a.push({t,b:m.l,c1:p(y[1]&&y[1].v),c2:p(y[2]&&y[2].v),c3:p(y[3]&&y[3].v),c4:p(y[4]&&y[4].v),c5:p(y[5]&&y[5].v),c6:p(y[6]&&y[6].v),c7:p(y[7]&&y[7].v),c8:p(y[8]&&y[8].v),tt:p(y[9]&&y[9].v),kj:p(y[10]&&y[10].v)})
      b+=p(y[9]&&y[9].v);c+=p(y[10]&&y[10].v)}
  }catch(e){}}
  a.sort((x,y)=>new Date(x.t.split("/").reverse().join("-"))-new Date(y.t.split("/").reverse().join("-")))
  D=a;E=b;G=c
  let h=[]
  for(const m of M){try{
    const r=await Q(W,m.g)
    for(const x of r){const y=x.c;if(!y||!y[0]||!y[0].v)continue
      const s=String(y[0].v).trim();if(!s||s=="No"||s=="NO")continue
      const n=parseInt(s,10);if(!n||n<=0)continue
      h.push({nb:["TRUE","1","Y"].includes(String(y[5]&&y[5].v||"").trim().toUpperCase()),b:m.l,no:s,
        pf:String(y[1]&&y[1].v||"").trim(),jm:p(y[2]&&y[2].v)})}
  }catch(e){}}
  H=h
  for(const m of M){try{
    const r=await Q(X,m.g);let tg="",rr=[]
    for(const x of r){const y=x.c;if(!y)continue
      if(y[3]&&y[3].v){const d=String(y[3].v).trim();if(d.includes("/"))tg=d}
      if(y[0]&&y[0].v){rr.push({u:String(y[0].v).trim(),p:String(y[1]&&y[1].v||"-").trim(),s:String(y[2]&&y[2].v||"-").trim(),t:String(y[3]&&y[3].v||"-").trim()})}}
    if(tg&&rr.length){K[tg]={tg,rr};N.push(tg)}
  }catch(e){}}
  N.sort((a,b)=>new Date(a.split("/").reverse().join("-"))-new Date(b.split("/").reverse().join("-")))
  if(N.length)L=N[N.length-1]
  T();R("p")
}
function T(){document.getElementById("tab").innerHTML=[{k:"p",l:"Penjualan"},{k:"l",l:"LPH"},{k:"f",l:"Faktur"}].map((t,i)=>'<button class="tab'+(i==0?" aktif":"")+'" onclick="O=''+t.k+"';R('"+t.k+"')">"+t.l+"</button>").join("")}
function R(k){if(k=="p")P();else if(k=="l")LP();else FT()}
function P(){
  const B=["Jan","Feb","Mar","Apr","Mei","Jun","Jul"];const fl=I?D.filter(d=>d.b==I):D
  const mt=fl.reduce((s,d)=>s+d.tt,0),mk=fl.reduce((s,d)=>s+d.kj,0)
  let h='<div style="margin-bottom:8px">'+B.map(b=>'<button class="btn'+(I==b?" on":"")+'" onclick="I=''+(I==b?"":"")+"';P()">"+b+"</button>").join("")+"<button class="btn"+(I==""?" on":"")+"" onclick="I='';P()">Semua</button></div>"
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'+
    '<div class="cd"><label>OMSET'+(I?" "+I:" 2026")+'</label><val style="color:#d97706">'+f(mt)+"</val></div>"+
    '<div class="cd"><label>KUNJUNGAN</label><val style="color:#2563eb">'+mk.toLocaleString("id-ID")+"</val></div>"+
    '<div class="cd"><label>RATA/HARI</label><val style="color:#059669">'+f(fl.length?Math.round(mt/fl.length):0)+"</val></div>"+
    '<div class="cd"><label>FAKTUR BELUM</label><val style="color:#dc2626">'+H.filter(d=>!d.nb).length+"</val></div></div>"+
    '<div class="tb"><h3>Omzet per Bulan</h3><div style="display:flex;gap:4px;align-items:end;height:80px;padding:4px;background:#f9fafb">'+
    B.map(b=>{const dd=D.filter(d=>d.b==b);const tot=dd.reduce((s,d)=>s+d.tt,0);const hh=E>0?(tot/E)*70:0
      return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:1px"><span style="font-size:7px;color:#999">'+f(tot)+'</span><div style="width:100%;height:'+Math.max(hh,2)+'px;background:'+(I==b?"#d97706":"#3b82f6")+';border-radius:2px 2px 0 0;min-height:2px"></div><span style="font-size:8px;color:#374151;font-weight:500">'+b+"</span></div>"}).join("")+
    '</div></div><div class="tb"><h3>Penjualan Harian 2026'+(I?" - "+I:"")+' ('+fl.length+' baris)</h3>'+
    '<div style="overflow:auto;max-height:400px"><table><thead><tr><th style="text-align:left">Tgl</th><th>CashP</th><th>ManP</th><th>QRP</th><th>JmlP</th><th>CashS</th><th>ManS</th><th>QRS</th><th>JmlS</th><th>Total</th><th>Kunj</th></tr></thead><tbody>'+
    [...fl].reverse().map(d=>"<tr><td class="l">"+d.t+"</td><td>"+f(d.c1)+"</td><td>"+f(d.c2)+"</td><td>"+f(d.c3)+"</td><td>"+f(d.c4)+"</td><td>"+f(d.c5)+"</td><td>"+f(d.c6)+"</td><td>"+f(d.c7)+"</td><td>"+f(d.c8)+'</td><td style="font-weight:600;color:#2563eb">'+f(d.tt)+"</td><td>"+d.kj+"</td></tr>").join("")+
    "</tbody></table></div></div>";document.getElementById("ctx").innerHTML=h
}
function LP(){
  if(!L||!K[L]){document.getElementById("ctx").innerHTML='<p style="color:#999;text-align:center;padding:20px">Loading LPH...</p>';return}
  const d=K[L];let h='<div style="margin-bottom:8px">'+
    '<select class="sl" onchange="L=this.value;LP()" style="max-width:200px">'+N.map(t=>'<option value="'+t+'"'+(L==t?" selected":"")+">"+t+"</option>").join("")+
    '</select> <button class="btn" onclick="window.print()" style="background:#1e40af;color:#fff;border:none">Cetak</button></div>'+
    '<div class="tb"><div style="text-align:center;padding:8px;border-bottom:1px solid #eee"><b>LAPORAN PENJUALAN HARIAN (LPH)</b><br><span style="font-size:10px;color:#999">APOTEK BALI BAGAS MEDIKA</span>'+
    (d.tg?"<br><b>TANGGAL: "+d.tg+"</b>":"")+'</div><table><thead><tr><th style="text-align:left">URAIAN</th><th>PAGI</th><th>SIANG</th><th>TOTAL</th></tr></thead><tbody>'+
    d.rr.map((r,i)=>"<tr"+(i%2?' style="background:#f8fafc"':"")+'><td class="l" style="font-weight:'+(r.u.toUpperCase()=="KUNJUNGAN"?600:400)+'">'+r.u+"</td><td>"+r.p+"</td><td>"+r.s+'</td><td style="font-weight:600">'+r.t+"</td></tr>").join("")+
    "</tbody></table></div>";document.getElementById("ctx").innerHTML=h
}
function FT(){
  const B=["Jan","Feb","Mar","Apr","Mei","Jun","Jul"];const fl=J?H.filter(d=>d.b==J):H
  const l=fl.filter(d=>d.nb).length,b=fl.filter(d=>!d.nb).length,n=fl.reduce((s,d)=>s+d.jm,0),p=fl.filter(d=>!d.nb).reduce((s,d)=>s+d.jm,0)
  let h='<div style="margin-bottom:8px">'+B.map(m=>'<button class="btn'+(J==m?" on":"")+'" onclick="J=''+(J==m?"":"")+"';FT()">"+m+"</button>").join("")+"<button class="btn"+(J==""?" on":"")+"" onclick="J='';FT()">Semua</button></div>"
  h+='<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'+
    '<div class="cd"><label>TOTAL'+(J?" "+J:"")+'</label><val>'+fl.length+"</val></div>"+
    '<div class="cd"><label>LUNAS</label><val style="color:#10b981">'+l+"</val></div>"+
    '<div class="cd"><label>BELUM</label><val style="color:#ef4444">'+b+"</val></div>"+
    '<div class="cd"><label>NILAI</label><val style="color:#8b5cf6;font-size:16px">'+f(n)+"</val></div>"+
    '<div class="cd"><label>PIUTANG</label><val style="color:#dc2626;font-size:16px">'+f(p)+"</val></div></div>"+
    '<div class="tb"><h3>Faktur 2026 ('+fl.length+' faktur)</h3>'+
    '<div style="overflow:auto;max-height:400px"><table><thead><tr><th style="text-align:left">Bln</th><th style="text-align:left">No</th><th style="text-align:left">PBF</th><th>Nilai</th><th style="text-align:center">Status</th></tr></thead><tbody>'+
    fl.slice(0,200).map(d=>'<tr class="'+(d.nb?"lunas":"belum")+'"><td class="l">'+d.b+'</td><td class="l">'+d.no+'</td><td class="l">'+d.pf+'</td><td>'+f(d.jm)+'</td><td style="text-align:center"><span class="badge '+(d.nb?"bdg-h":"bdg-m")+'">'+(d.nb?"LUNAS":"BELUM")+"</span></td></tr>").join("")+
    "</tbody></table></div></div>";document.getElementById("ctx").innerHTML=h
}
init()
</script>
</body>
</html>
